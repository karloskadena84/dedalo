[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dedalo"
version = "0.1.0"
description = "Dédalo — Asistente conversacional que construye pipelines de agentes secuenciales a partir de tus procesos repetitivos. Empieza por el correo y escala según tus respuestas."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Dédalo Team" }
]
keywords = ["agents", "automation", "email", "mcp", "cli", "pipelines"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.120.0",
    "msal>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
mcp = [
    "mcp>=1.0.0",
]

[project.scripts]
dedalo = "dedalo.cli:app"

[project.urls]
Homepage = "https://github.com/tu-usuario/dedalo"
Repository = "https://github.com/tu-usuario/dedalo"

[tool.hatch.build.targets.wheel]
packages = ["src/dedalo"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
